button{border:1px solid var(--line);background:transparent;color:var(--tx);border-radius:8px;padding:5px 9px;font-size:13px}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#tools{position:fixed;right:calc(env(safe-area-inset-right,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 44px);width:min(270px,40vw);max-height:calc(100vh - 150px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12px;display:none;z-index:5}
#ex div{padding:4px 6px;border-radius:6px;white-space:nowrap}

#base{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid #ffffffaa;background:#00000033;pointer-events:none}

.bhp{position:fixed;left:0;top:0;transform:translate(-50%,-100%);z-index:3;pointer-events:none;text-align:center;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
.bhp i{display:block;width:84px;height:9px;border:2px solid #fff;border-radius:6px;background:#0008;overflow:hidden;margin:2px auto 0}
.bhp b{display:block;height:100%;width:100%;background:#e0453a}
.pop{position:fixed;transform:translate(-50%,-50%);z-index:6;pointer-events:none;font-weight:800;font-size:22px;color:#ffd84a;text-shadow:0 2px 4px #000;animation:pop .8s ease-out forwards}
@keyframes pop{to{transform:translate(-50%,-190%);opacity:0}}

#a.down{transform:scale(.92);background:#5a9bf0cc}
#a small{font-size:10px;font-weight:600;margin-top:-3px}
#slot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:58px;height:58px;border-radius:10px;background:#000a;border:2px solid #ffffff99;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;z-index:4;touch-action:none}

#slot.on{border-color:#ffd84a;box-shadow:0 0 12px #ffd84a}
.npcl{position:fixed;left:0;top:0;transform:translate(-50%,-100%);text-align:center;pointer-events:none;z-index:3;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px #000}
.npcl b{display:block;font-size:30px;color:#ffd84a;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
#quest{position:fixed;left:calc(env(safe-area-inset-left,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 46px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12px;z-index:3;pointer-events:none}
#qrow{display:none;margin-top:3px;color:#d49a00}
#talk{display:none;position:fixed;right:calc(env(safe-area-inset-right,0px) + 52px);bottom:calc(env(safe-area-inset-bottom,0px) + 132px);width:58px;height:58px;border-radius:50%;background:#e0a800cc;border:3px solid #ffffffcc;color:#fff;font-size:24px;flex-direction:column;align-items:center;justify-content:center;z-index:4;touch-action:none}
#talk small{font-size:9px;font-weight:700;margin-top:-2px}
#dlg{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:min(560px,74vw);background:var(--panel);border:2px solid #ffd84a;border-radius:12px;padding:10px 14px;font-size:14px;z-index:7}
#dlg p{margin:6px 0 10px}
#db{display:flex;gap:8px;justify-content:flex-end}
#db button{background:#ffd84a;color:#1b1f2a;border:0;font-weight:700;padding:7px 14px}
.npcl small{display:block;font-size:10px;font-weight:500;opacity:.85}
#hpw{position:relative;width:150px;height:16px;border:2px solid #fff;border-radius:6px;background:#0008;overflow:hidden;margin-bottom:4px}
#hpf{display:block;height:100%;width:100%;background:#27c24c;transition:width .15s}
#hpt{position:absolute;left:0;right:0;top:0;text-align:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;line-height:12px}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;transition:opacity .4s;background:radial-gradient(transparent 45%,#ff1a1acc)}
#dead{display:none;position:fixed;inset:0;background:#000a;color:#fff;font-size:44px;font-weight:800;align-items:center;justify-content:center;flex-direction:column;z-index:8;pointer-events:none}
#dead small{font-size:16px;font-weight:500}
#zm{position:fixed;right:calc(env(safe-area-inset-right,0px) + 10px);top:38%;display:flex;flex-direction:column;gap:8px;z-index:4}

#slot{display:none}
#quest{z-index:5}

#ptb{display:none;position:absolute;right:-9px;top:-9px;min-width:18px;height:18px;border-radius:9px;background:#e53935;color:#fff;font-size:11px;align-items:center;justify-content:center;padding:0 4px}
#mnl{display:none;flex-direction:column;gap:4px;margin-bottom:4px}
.lvr{display:flex;justify-content:space-between;font-weight:700;margin-bottom:3px}

#pnh{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
#pnb{padding:8px 12px;overflow:auto;font-size:13px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.srow small{display:block;font-size:11px;color:var(--mut)}
.srow input{width:54px}
.tabs{display:flex;gap:6px;margin-bottom:8px}

.inv{display:flex;gap:10px}
.cards{display:flex;flex-direction:column;gap:6px;width:42%}
.card{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;gap:8px;align-items:center}

.det{flex:1}
#qrow small{display:block;opacity:.85;color:var(--tx)}
.bhp em{display:block;color:#ff3030;font-style:normal;font-size:16px;line-height:12px;text-shadow:0 1px 2px #000}
.qc{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.qc.lk{opacity:.6}
.qh{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}

#base{width:calc(120px*var(--s));height:calc(120px*var(--s))}
#knob{width:calc(54px*var(--s));height:calc(54px*var(--s));margin:calc(-27px*var(--s)) 0 0 calc(-27px*var(--s))}
.bar{font-size:12px;padding:2px 6px;top:calc(env(safe-area-inset-top,0px) + 4px);gap:4px}
.bar button{padding:3px 8px;font-size:12px}
#quest{top:calc(env(safe-area-inset-top,0px) + 34px);font-size:11px;padding:3px 6px}
#tools{top:calc(env(safe-area-inset-top,0px) + 36px)}
#hpw,#xpw,#enw{width:calc(96px + 56px*var(--s));height:12px}
#hpt,#xpt,#ent{font-size:9px;line-height:9px}
#menuB{padding:2px 14px;font-size:12px}
.lvr{font-size:11px}

#ds{background:#26a69acc;right:calc(env(safe-area-inset-right,0px) + 28px + 92px*var(--s));bottom:calc(env(safe-area-inset-bottom,0px) + 16px + 72px*var(--s))}
