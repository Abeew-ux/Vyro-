<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>VYRO World</title>
<style>
:root{--u:min(1vh,.5vw);--sr:env(safe-area-inset-right,0px);--sl:env(safe-area-inset-left,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0420;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:none}
.bar{position:relative;height:calc(var(--u)*4.2);border-radius:calc(var(--u)*2.2);background:rgba(8,4,24,.7);border:1px solid rgba(255,255,255,.18);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:inherit;transition:width .15s}
.bar.hp i{background:linear-gradient(#ff6b8b,#e0224f)}
.bar.en i{background:linear-gradient(#b58cff,#6d28d9)}
.bar.xp{height:calc(var(--u)*1.6)}.bar.xp i{background:linear-gradient(90deg,#facc15,#f59e0b)}
.bar b{position:absolute;left:0;right:0;top:0;bottom:0;display:grid;place-items:center;font-size:calc(var(--u)*2.8);font-weight:800;text-shadow:0 1px 3px #000}
#tl{position:absolute;left:calc(var(--sl) + var(--u)*3);top:calc(var(--st) + var(--u)*3);display:flex;gap:calc(var(--u)*2);align-items:center}
#lvb{width:calc(var(--u)*10);height:calc(var(--u)*10);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:calc(var(--u)*5);background:radial-gradient(#7c3aed,#2e1065);border:2px solid #facc15;box-shadow:0 0 14px rgba(168,85,247,.8)}
#tl .bars{display:flex;flex-direction:column;gap:calc(var(--u)*1.2);width:calc(var(--u)*34)}
#tc{position:absolute;left:50%;top:calc(var(--st) + var(--u)*3);transform:translateX(-50%);text-align:center;font-weight:800;text-shadow:0 2px 6px #000;font-size:calc(var(--u)*3.4)}
#tc small{display:block;font-weight:600;opacity:.8;font-size:calc(var(--u)*2.7)}
#tr{position:absolute;right:calc(var(--sr) + var(--u)*3);top:calc(var(--st) + var(--u)*3);display:flex;gap:calc(var(--u)*2);align-items:center;pointer-events:auto!important}
#coins{padding:calc(var(--u)*1.6) calc(var(--u)*3.4);border-radius:99px;background:rgba(8,4,24,.7);border:1px solid rgba(255,255,255,.18);font-weight:800;font-size:calc(var(--u)*3.4)}
.ib{width:calc(var(--u)*8.5);height:calc(var(--u)*8.5);border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(8,4,24,.7);color:#fff;font-size:calc(var(--u)*4);display:grid;place-items:center;padding:0}
#jz{position:absolute;left:0;top:30%;bottom:0;width:46%;pointer-events:auto!important}
#cz{position:absolute;left:46%;right:0;top:0;bottom:0;pointer-events:auto!important}
#joy{position:absolute;width:calc(var(--u)*26);height:calc(var(--u)*26);border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.25);display:none;transform:translate(-50%,-50%)}
#joy.show,#joy.idle{display:block}#joy.idle{opacity:.45}
#knob{position:absolute;left:50%;top:50%;width:calc(var(--u)*11);height:calc(var(--u)*11);margin:calc(var(--u)*-5.5) 0 0 calc(var(--u)*-5.5);border-radius:50%;background:radial-gradient(#c4a3ff,#7c3aed);box-shadow:0 0 14px rgba(168,85,247,.8)}
.b{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:radial-gradient(rgba(124,58,237,.75),rgba(30,10,70,.85));color:#fff;display:grid;place-items:center;font-size:calc(var(--u)*5.2);overflow:hidden;pointer-events:auto!important;padding:0;box-shadow:0 0 14px rgba(124,58,237,.55)}
.b:active,.b.dn{transform:scale(.92);filter:brightness(1.4)}
.b small{position:absolute;bottom:3%;font-size:calc(var(--u)*2.2);font-weight:800;opacity:.85}
.b .cd{position:absolute;inset:0;background:rgba(0,0,0,.65);transform-origin:50% 100%;transform:scaleY(0)}
.b.nope{filter:grayscale(1) brightness(.7)}
#bA{right:calc(var(--sr) + var(--u)*4);bottom:calc(var(--sb) + var(--u)*4);width:calc(var(--u)*20);height:calc(var(--u)*20);font-size:calc(var(--u)*9);background:radial-gradient(#ff7ac8,#8b1c62);border-color:#ffd1ee}
#bJ{right:calc(var(--sr) + var(--u)*5);bottom:calc(var(--sb) + var(--u)*27);width:calc(var(--u)*13);height:calc(var(--u)*13)}
#bR{right:calc(var(--sr) + var(--u)*20);bottom:calc(var(--sb) + var(--u)*27);width:calc(var(--u)*13);height:calc(var(--u)*13)}
.sk{bottom:calc(var(--sb) + var(--u)*5);width:calc(var(--u)*13);height:calc(var(--u)*13);border-color:#d8b4fe}
#s1{right:calc(var(--sr) + var(--u)*27)}#s2{right:calc(var(--sr) + var(--u)*41.5)}#s3{right:calc(var(--sr) + var(--u)*56)}
#s4{right:calc(var(--sr) + var(--u)*70.5);border-color:#facc15;background:radial-gradient(#4c1d95,#0b0420)}
#vig{position:fixed;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(10,0,30,.9) 100%);transition:opacity .4s;pointer-events:none}
#fl{position:fixed;inset:0;opacity:0;background:#ff1744;mix-blend-mode:screen;pointer-events:none;transition:opacity .25s}
#wh{position:fixed;inset:0;opacity:0;background:#fff;pointer-events:none;transition:opacity .35s}
.dmg{position:fixed;font-weight:900;font-size:calc(var(--u)*4.6);color:#fff;text-shadow:0 0 6px #7c3aed,0 2px 0 #000,0 0 2px #000;pointer-events:none;transform:translate(-50%,-50%);animation:dm .8s ease-out forwards;white-space:nowrap}
.dmg.crit{color:#ffd54a;font-size:calc(var(--u)*6.4)}.dmg.me{color:#ff5b7f}.dmg.hl{color:#6bff9a}
@keyframes dm{0%{opacity:0;margin-top:0;scale:.5}15%{opacity:1;scale:1.25}100%{opacity:0;margin-top:calc(var(--u)*-11);scale:1}}
.eb{position:fixed;width:calc(var(--u)*11);height:calc(var(--u)*1.7);margin-left:calc(var(--u)*-5.5);background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.4);border-radius:3px;overflow:hidden;pointer-events:none}
.eb i{display:block;height:100%;background:linear-gradient(#ff6b8b,#c8183f)}
.eb.boss{width:calc(var(--u)*22);margin-left:calc(var(--u)*-11);height:calc(var(--u)*2.4)}
.eb span{position:absolute;left:50%;top:calc(var(--u)*-3.3);transform:translateX(-50%);font-size:calc(var(--u)*2.4);font-weight:800;white-space:nowrap;text-shadow:0 1px 3px #000}
#ban{position:fixed;left:0;right:0;top:15%;text-align:center;font-weight:900;font-size:calc(var(--u)*6.5);letter-spacing:.06em;text-shadow:0 0 20px #a855f7,0 3px 0 #000;opacity:0;transform:scale(.7);pointer-events:none;transition:opacity .35s,transform .35s}
#ban.on{opacity:1;transform:scale(1)}#ban small{display:block;font-size:calc(var(--u)*3.2);letter-spacing:.02em;opacity:.9}
#panel{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,2,15,.72);pointer-events:auto!important;backdrop-filter:blur(4px)}
#panel.on{display:grid}
#pbox{width:min(92%,calc(var(--u)*130));max-height:92%;overflow:auto;border-radius:calc(var(--u)*5);background:linear-gradient(#24104a,#120728);border:1px solid rgba(168,85,247,.5);padding:calc(var(--u)*4);box-shadow:0 0 40px rgba(124,58,237,.5)}
#pbox h2{margin:0 0 calc(var(--u)*2);font-size:calc(var(--u)*5)}
#pbox .arts{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*2);margin:calc(var(--u)*2) 0}
#pbox .art{border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.4) 4px;text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:calc(var(--u)*2.9);font-weight:700}
#pbox .art em{display:block;font-style:normal;font-size:calc(var(--u)*7)}
#pbox .art.on{border-color:#facc15;background:rgba(124,58,237,.35)}
#pbox .art.lock{opacity:.5}
#pbox p{margin:calc(var(--u)*1.5) 0;font-size:calc(var(--u)*3)}
#pbox .row{display:flex;gap:calc(var(--u)*2.5);margin-top:calc(var(--u)*3)}
#pbox button{flex:1;border:0;border-radius:calc(var(--u)*3);padding:calc(var(--u)*3);font-weight:800;font-size:calc(var(--u)*3.6);color:#fff;background:#7c3aed}
#pbox button.g{background:rgba(255,255,255,.14)}#pbox button.r{background:#be123c}
#dead{position:fixed;inset:0;display:none;place-items:center;background:rgba(40,0,10,.55);font-weight:900;font-size:calc(var(--u)*9);text-shadow:0 3px 0 #000;text-align:center;pointer-events:none}
#dead small{display:block;font-size:calc(var(--u)*3.6)}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:20px;background:#0a0420;font-size:16px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
 <div id="tl"><div id="lvb">1</div><div class="bars"><div class="bar hp"><i id="hpi"></i><b id="hpt"></b></div><div class="bar en"><i id="eni"></i></div><div class="bar xp"><i id="xpi"></i></div></div></div>
 <div id="tc"><div id="qt"></div><small id="qs"></small></div>
 <div id="tr"><div id="coins">🪙 0</div><button class="ib" id="mute" type="button">🔊</button><button class="ib" id="menu" type="button">☰</button></div>
 <div id="jz"></div><div id="cz"></div>
 <div id="joy"><div id="knob"></div></div>
 <button class="b" id="bA" type="button">⚔️</button>
 <button class="b" id="bJ" type="button">⤒</button>
 <button class="b" id="bR" type="button">💨</button>
 <button class="b sk" id="s1" type="button">🌙<small>Z</small><div class="cd"></div></button>
 <button class="b sk" id="s2" type="button">⛓️<small>X</small><div class="cd"></div></button>
 <button class="b sk" id="s3" type="button">👻<small>C</small><div class="cd"></div></button>
 <button class="b sk" id="s4" type="button">🌑<small>V</small><div class="cd"></div></button>
 <div id="vig"></div><div id="fl"></div><div id="wh"></div>
 <div id="ban"></div><div id="dead"></div>
</div>
<div id="panel"><div id="pbox"></div></div>
<div id="err"></div>
<script src="babylon.js"></script>
<script>
"use strict";
(function(){
var EMB=false,UID="";
try{EMB=parent!==window;UID=(new URLSearchParams(location.search).get("u")||"").replace(/[^0-9a-f-]/gi,"")}catch(e){}
var $=function(s){return document.querySelector(s)};
if(typeof BABYLON==="undefined"){var er=$("#err");er.style.display="grid";er.textContent="Le moteur du jeu (babylon.js) est introuvable. Vérifie que le fichier babylon.js est bien sur ton site.";return}
var B=BABYLON,V3=B.Vector3,C3=B.Color3,C4=B.Color4;
var mobile=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)||("ontouchstart" in window);

/* ================= sauvegarde ================= */
var SK="vyroworld2"+(UID?"_"+UID:"");
var SV={lv:1,xp:0,coins:0,mute:false,best:1};
try{var _s=JSON.parse(localStorage.getItem(SK)||"null");if(_s)for(var k in _s)SV[k]=_s[k]}catch(e){}
function save(){try{localStorage.setItem(SK,JSON.stringify(SV))}catch(e){}}
function xpNeed(l){return 40+l*30}
function maxHp(){return 100+(SV.lv-1)*12}
function dmgMul(){return 1+(SV.lv-1)*.09}

/* ================= moteur ================= */
var cv=$("#cv");
var engine=new B.Engine(cv,false,{preserveDrawingBuffer:false,stencil:false,powerPreference:"high-performance",antialias:!mobile},true);
var scaling=mobile?Math.max(1,Math.min(1.5,(window.devicePixelRatio||1)/1.6)):1;
engine.setHardwareScalingLevel(scaling);
var scene=new B.Scene(engine);
scene.clearColor=new C4(.05,.02,.14,1);
scene.fogMode=B.Scene.FOGMODE_EXP2;scene.fogColor=new C3(.17,.07,.32);scene.fogDensity=.0065;
scene.skipPointerMovePicking=true;scene.autoClearDepthAndStencil=true;
scene.pointerMovePredicate=function(){return false};
var LQ=false; /* mode économie */

function mat(hex,emi,alpha){var m=new B.StandardMaterial("m",scene);m.diffuseColor=C3.FromHexString(hex);m.specularColor=new C3(0,0,0);if(emi)m.emissiveColor=C3.FromHexString(emi);if(alpha!=null){m.alpha=alpha}return m}
function glowMat(hex,alpha){var m=new B.StandardMaterial("g",scene);m.diffuseColor=new C3(0,0,0);m.specularColor=new C3(0,0,0);m.emissiveColor=C3.FromHexString(hex);m.disableLighting=true;if(alpha!=null)m.alpha=alpha;return m}

/* lumières */
var hemi=new B.HemisphericLight("h",new V3(0,1,0),scene);hemi.diffuse=C3.FromHexString("#b9a0ff");hemi.groundColor=C3.FromHexString("#3a1d6e");hemi.intensity=.85;
var moon=new B.DirectionalLight("d",new V3(-.4,-1,.35),scene);moon.diffuse=C3.FromHexString("#d9c8ff");moon.intensity=.8;
var gl=null;
try{gl=new B.GlowLayer("gl",scene,{mainTextureFixedSize:256,blurKernelSize:24});gl.intensity=.95}catch(e){}

/* textures procédurales */
function radTex(soft,ring){var t=new B.DynamicTexture("t",64,scene,false);var c=t.getContext();var g=c.createRadialGradient(32,32,0,32,32,32);
 if(ring){g.addColorStop(0,"rgba(255,255,255,0)");g.addColorStop(.6,"rgba(255,255,255,0)");g.addColorStop(.82,"rgba(255,255,255,1)");g.addColorStop(1,"rgba(255,255,255,0)")}
 else{g.addColorStop(0,"rgba(255,255,255,1)");g.addColorStop(soft?.2:.4,"rgba(255,255,255,"+(soft?.55:.7)+")");g.addColorStop(1,"rgba(255,255,255,0)")}
 c.fillStyle=g;c.fillRect(0,0,64,64);t.update();t.hasAlpha=true;return t}
var T_GLOW=radTex(false),T_SOFT=radTex(true);

/* ================= ciel ================= */
(function(){
 var t=new B.DynamicTexture("sky",{width:8,height:512},scene,false);var c=t.getContext();var g=c.createLinearGradient(0,0,0,512);
 g.addColorStop(0,"#05010f");g.addColorStop(.35,"#1d0a44");g.addColorStop(.6,"#4a1a8a");g.addColorStop(.78,"#8a2fb0");g.addColorStop(.9,"#5a1f7a");g.addColorStop(1,"#1a0836");
 c.fillStyle=g;c.fillRect(0,0,8,512);t.update();
 var sk=B.MeshBuilder.CreateSphere("sky",{diameter:1800,segments:12,sideOrientation:B.Mesh.BACKSIDE},scene);
 var m=new B.StandardMaterial("skym",scene);m.emissiveTexture=t;m.disableLighting=true;m.backFaceCulling=false;m.fogEnabled=false;sk.material=m;sk.infiniteDistance=true;sk.isPickable=false;
 /* étoiles */
 var st=B.MeshBuilder.CreatePlane("star",{size:2.2},scene);st.material=glowMat("#ffffff");st.billboardMode=7;st.fogEnabled=false;st.isPickable=false;
 var arr=[];for(var i=0;i<220;i++){var a=Math.random()*6.283,e=.08+Math.random()*1.2,r=800;arr.push(B.Matrix.Translation(Math.cos(a)*Math.cos(e)*r,Math.sin(e)*r+20,Math.sin(a)*Math.cos(e)*r))}
 var buf=new Float32Array(arr.length*16);arr.forEach(function(m,i){m.copyToArray(buf,i*16)});st.thinInstanceSetBuffer("matrix",buf,16,true);st.alwaysSelectAsActiveMesh=true;
 var stm=st.material;stm.fogEnabled=false;
 /* lune */
 var mo=B.MeshBuilder.CreateDisc("moon",{radius:95,tessellation:48},scene);mo.position.set(-120,230,520);mo.billboardMode=7;mo.isPickable=false;
 var mm=glowMat("#d8c4ff");mm.fogEnabled=false;mo.material=mm;
 var mh=B.MeshBuilder.CreateDisc("moonh",{radius:190,tessellation:32},scene);mh.position.set(-120,230,525);mh.billboardMode=7;
 var hm=glowMat("#9b5cff",.22);hm.fogEnabled=false;hm.opacityTexture=T_SOFT;mh.material=hm;
})();

/* ================= île ================= */
var R=26,GY=.5;
var pillars=[]; /* obstacles */
(function(){
 var bx=B.MeshBuilder.CreateBox("blk",{size:1},scene);var bm=new B.StandardMaterial("bm",scene);bm.diffuseColor=new C3(1,1,1);bm.specularColor=new C3(0,0,0);bx.material=bm;
 var mats=[],cols=[];
 function rnd(a){return a[Math.floor(Math.random()*a.length)]}
 for(var y=0;y>=-9;y--){
  var rr=R*(1-(-y)*.085)-(y<-5?(-y-5)*1.3:0);
  for(var x=-R-1;x<=R+1;x++)for(var z=-R-1;z<=R+1;z++){
   var d=Math.hypot(x,z),noise=(Math.sin(x*1.7+y)+Math.cos(z*1.3-y*2))*.6;
   if(d>rr+noise)continue;
   /* intérieur creux en profondeur pour économiser */
   if(y<0&&d<rr-3.2)continue;
   mats.push(B.Matrix.Translation(x,y,z));
   var k=Math.random();
   if(y===0){var base=(x+z)&1?[.19,.12,.33]:[.16,.1,.29];var d2=Math.hypot(x,z);if(d2>R-2.4)base=[.3,.17,.5];cols.push(base[0]+k*.04,base[1]+k*.03,base[2]+k*.05,1)}
   else{var f=1+y*.09;cols.push(.16*f+k*.03,.1*f,.22*f+k*.04,1)}
  }
 }
 var buf=new Float32Array(mats.length*16);mats.forEach(function(m,i){m.copyToArray(buf,i*16)});
 bx.thinInstanceSetBuffer("matrix",buf,16,true);bx.thinInstanceSetBuffer("color",new Float32Array(cols),4,true);bx.freezeWorldMatrix();bx.alwaysSelectAsActiveMesh=true;
 /* cercle magique central */
 var ringM=glowMat("#a855f7");
 [3,6.2,11.5].forEach(function(r,i){var t=B.MeshBuilder.CreateTorus("mr",{diameter:r*2,thickness:.14,tessellation:64},scene);t.position.y=GY+.06;t.scaling.y=.25;t.material=ringM;t.isPickable=false;t.freezeWorldMatrix()});
 var star=[];for(var i=0;i<6;i++){var a1=i*Math.PI/3*2,a2=(i+2)*Math.PI/3*2;
  var p1=new V3(Math.cos(a1)*6.2,GY+.07,Math.sin(a1)*6.2),p2=new V3(Math.cos(a2)*6.2,GY+.07,Math.sin(a2)*6.2);star.push([p1,p2])}
 var ln=B.MeshBuilder.CreateLineSystem("mstar",{lines:star},scene);ln.color=C3.FromHexString("#c084fc");ln.isPickable=false;
 /* piliers avec runes */
 var pm=mat("#241446"),rm=glowMat("#b26bff");
 for(var i=0;i<8;i++){var a=i/8*Math.PI*2+.2,r=19.5+(i%2)*2;var px=Math.cos(a)*r,pz=Math.sin(a)*r;
  var h=7+(i%3)*1.6;
  var p=B.MeshBuilder.CreateBox("pl",{width:2.2,height:h,depth:2.2},scene);p.position.set(px,GY+h/2,pz);p.material=pm;p.freezeWorldMatrix();
  var cap=B.MeshBuilder.CreateBox("pc",{width:2.9,height:.7,depth:2.9},scene);cap.position.set(px,GY+h+.35,pz);cap.material=pm;cap.freezeWorldMatrix();
  for(var s=0;s<2;s++){var rune=B.MeshBuilder.CreateBox("rn",{width:.9,height:2.4,depth:.06},scene);rune.position.set(px,GY+h*.55+s*1.8,pz);rune.rotation.y=-a+Math.PI/2;rune.translate(new V3(0,0,0),0);
   rune.locallyTranslate(new V3(0,0,-1.12));rune.material=rm;rune.freezeWorldMatrix()}
  var fl=B.MeshBuilder.CreateSphere("fl",{diameter:.9,segments:6},scene);fl.position.set(px,GY+h+1.1,pz);fl.material=glowMat("#d9a8ff");
  pillars.push({x:px,z:pz,r:1.7})}
 /* cristaux */
 var cm=glowMat("#8b5cf6");
 for(var i=0;i<26;i++){var a=Math.random()*Math.PI*2,r=8+Math.random()*16;var cr=B.MeshBuilder.CreateCylinder("cr",{diameterTop:0,diameterBottom:.55+Math.random()*.5,height:1.2+Math.random()*1.8,tessellation:5},scene);
  cr.position.set(Math.cos(a)*r,GY+.7,Math.sin(a)*r);cr.rotation.set((Math.random()-.5)*.5,Math.random()*3,(Math.random()-.5)*.5);cr.material=cm;cr.freezeWorldMatrix()}
 /* rochers flottants */
 var rk=B.MeshBuilder.CreateBox("rk",{size:1},scene);rk.material=bm;
 var rm2=[],rc=[];
 for(var i=0;i<34;i++){var a=Math.random()*6.283,r=45+Math.random()*110,y=-25+Math.random()*75,s=2+Math.random()*7;
  var m=B.Matrix.Compose(new V3(s,s*(.6+Math.random()*.6),s),B.Quaternion.RotationYawPitchRoll(Math.random()*3,Math.random()*.5,Math.random()*.5),new V3(Math.cos(a)*r,y,Math.sin(a)*r));rm2.push(m);
  rc.push(.17+Math.random()*.05,.1,.28+Math.random()*.06,1)}
 var rb=new Float32Array(rm2.length*16);rm2.forEach(function(m,i){m.copyToArray(rb,i*16)});
 rk.thinInstanceSetBuffer("matrix",rb,16,true);rk.thinInstanceSetBuffer("color",new Float32Array(rc),4,true);rk.freezeWorldMatrix();rk.alwaysSelectAsActiveMesh=true;
 /* château lointain */
